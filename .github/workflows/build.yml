---
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show tool versions
        run: |
          set -euo pipefail
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          bash --version | head -n 1

      - name: Shell syntax check
        run: |
          set -euo pipefail
          bash -n module/customize.sh
          bash -n tests/test-installer.sh
          bash -n provenance/upstream/module_installer.sh

      - name: Installer guard tests
        run: bash tests/test-installer.sh

      - name: Build module ZIP
        run: pwsh -NoProfile -File ./build-module.ps1

      - name: Verify the build reproduces the committed files
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            module/system/vendor/etc/audio_device.xml \
            module/META-INF

      # actions/upload-artifact v7.0.2
      - name: Upload module ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: earth-dual-speaker-module
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
